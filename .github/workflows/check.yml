# site-check: the status check every pull request to main waits for (docs/releases/automation.md in
# NervaLog/nerva). The job's name is the check's name: renaming it breaks the ruleset that requires it.
name: site-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Node comes with the runner image; no setup action is needed.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: The checker's own tests
        run: node --test .github/scripts/site_check.test.mjs

      - name: The page parses and its data is well formed
        run: node .github/scripts/site_check.mjs index.html

      # The Worker build copies exactly these three files and refuses the build without them
      # (NRV-E1152, docs/releases/packages.md in NervaLog/nerva).
      - name: index.html, 404.html and _headers are regular files
        run: node .github/scripts/site_check.mjs --files .

      # Every name the build refuses, and one WKD file without the other (NRV-E1152).
      - name: The tree holds only names the build allows
        run: node .github/scripts/site_check.mjs --tree .

      # The WKD pair is Nerva's key file at the newest published v* tag on main, found by the checker
      # from Nerva's release data, never named by the pull request (NRV-E1162).
      - name: The WKD key is Nerva's key file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/site_check.mjs --wkd .

      # HEAD is the merge commit: HEAD^1 is the base it merges into. Under `pull_request` this
      # workflow and the checker come from the PR itself, so a PR that edits them checks itself.
      # This step refuses the one combination that matters: changing .github/ and the release data
      # (a RELEASES entry or SITE.version, released, updated) together. The owner's ruleset should
      # also require review for changes under .github/ (a ruleset rule), which this step cannot do.
      - name: A pull request does not change its own checker and the release data
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -q '^\.github/' &&
             git diff -U0 HEAD^1 HEAD -- index.html | grep -Eq '^[+-](  (version|released|updated): |  \{v:"|const RELEASES)'; then
            echo "site-check: a pull request that changes .github/ must not also change the release data in index.html"
            exit 1
          fi

      # A release may change only the new RELEASES entry and SITE.version, SITE.released and
      # SITE.updated. It is a release pull request if its branch is `release/v*` or it was opened
      # by the release App (a Bot whose login is the repository variable RELEASE_APP_LOGIN): the
      # branch name is chosen by whoever pushes, the author is not, so a bot PR from any other
      # branch gets the same restriction rather than none. Anyone else's PR is not restricted here
      # (the owner's review is); the App's can only ever be a release.
      - name: A release changes only what a release may
        env:
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
        run: |
          is_release=no; version=()
          case "$HEAD_REF" in
            release/v*) is_release=yes; version=(--version "${HEAD_REF#release/v}") ;;
          esac
          if [ "$AUTHOR_TYPE" = Bot ] && [ -n "$APP_LOGIN" ] && [ "$AUTHOR_LOGIN" = "$APP_LOGIN" ]; then
            is_release=yes
          fi
          if [ "$is_release" = no ]; then echo "not a release pull request"; exit 0; fi
          git show HEAD^1:index.html > "$RUNNER_TEMP/base-index.html"
          mapfile -t changed < <(git diff --name-only HEAD^1 HEAD)
          node .github/scripts/site_check.mjs index.html --release "$RUNNER_TEMP/base-index.html" "${version[@]}" "${changed[@]}"
